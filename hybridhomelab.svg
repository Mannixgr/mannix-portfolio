<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="m-s" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#8EB69B"/></marker>
<marker id="m-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#f0a53a"/></marker>
<marker id="m-p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#ff4fa3"/></marker>
<marker id="m-g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#8EB69B"/></marker>
</defs>
<rect width="1500" height="900" fill="#051F20"/>
<text x="30" y="40" font-size="24" font-weight="bold" text-anchor="start" fill="#DAF1DE">Enterprise Hybrid AWS: Cloud Architecture</text>
<text x="30" y="62" font-size="13" font-weight="normal" text-anchor="start" fill="#8EB69B">Terraform-managed multi-AZ VPC in ca-central-1 · GitHub Actions over OIDC with a gated apply · site-to-site VPN to the homelab</text>
<rect x="1310" y="22" width="160" height="30" rx="15" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="1390" y="42" font-size="12" font-weight="bold" text-anchor="middle" fill="#8EB69B">Diagram 1 of 2</text>

<!-- CI/CD pipeline -->
<rect x="30" y="150" width="220" height="670" rx="12" fill="#0B2B26" stroke="#3f7a68" stroke-width="1.5"/>
<text x="48" y="174" font-size="12" font-weight="bold" text-anchor="start" fill="#a9cdb5">CI/CD PIPELINE</text>
<rect x="50" y="200" width="180" height="64" rx="8" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="140" y="221" font-size="12" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Pull request</text>
<text x="140" y="238" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">validate + plan (read-only role)</text>
<text x="140" y="254" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">required check on main</text>
<rect x="50" y="300" width="180" height="64" rx="8" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="140" y="321" font-size="12" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Merge to main</text>
<text x="140" y="338" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">apply job pauses for approval</text>
<text x="140" y="354" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">in the dev environment</text>
<rect x="50" y="400" width="180" height="64" rx="8" fill="#3a1a1f" stroke="#f06a7c" stroke-width="1.5"/>
<text x="140" y="421" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffb3bd">Apply role via OIDC</text>
<text x="140" y="438" font-size="11" font-weight="normal" text-anchor="middle" fill="#ffb3bd">short-lived credentials</text>
<text x="140" y="454" font-size="11" font-weight="normal" text-anchor="middle" fill="#ffb3bd">no stored access keys</text>
<rect x="50" y="500" width="180" height="64" rx="8" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="140" y="521" font-size="12" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Terraform apply</text>
<text x="140" y="538" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">modules/network</text>
<text x="140" y="554" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">modules/site-to-site-vpn</text>
<rect x="50" y="600" width="180" height="52" rx="8" fill="#0B2B26" stroke="#3f7a68" stroke-width="1.2"/>
<text x="140" y="621" font-size="11" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Remote state: S3</text>
<text x="140" y="638" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B">native locking (use_lockfile)</text>
<rect x="50" y="690" width="180" height="70" rx="8" fill="#0B2B26" stroke="#3f7a68" stroke-width="1.2"/>
<text x="140" y="712" font-size="11" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Bootstrap</text>
<text x="140" y="729" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B">OIDC provider + plan/apply roles</text>
<text x="140" y="745" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B">applied locally, never by CI</text>
<text x="140" y="790" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B" font-style="italic">Dev is torn down when idle and</text>
<text x="140" y="805" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B" font-style="italic">rebuilt through this pipeline.</text>
<path d="M140,264 V298" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<path d="M140,364 V398" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<text x="148" y="386" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B">approved</text>
<path d="M140,464 V498" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<text x="148" y="486" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B">assume role</text>
<path d="M140,564 V598" fill="none" stroke="#8EB69B" stroke-width="1.5" marker-end="url(#m-s)"/>
<path d="M50,725 H40 V432 H48" fill="none" stroke="#8EB69B" stroke-width="1.5" marker-end="url(#m-s)"/>
<path d="M230,532 H308" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<text x="238" y="523" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B">provisions</text>

<!-- AWS -->
<rect x="290" y="150" width="740" height="670" rx="4" fill="none" stroke="#5f9a84" stroke-width="1.5"/>
<text x="310" y="174" font-size="12" font-weight="bold" text-anchor="start" fill="#DAF1DE">AWS Cloud · ca-central-1</text>
<ellipse cx="630" cy="104" rx="62" ry="22" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="630" y="109" font-size="13" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Internet</text>
<path d="M630,126 V170" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<rect x="602" y="172" width="56" height="56" rx="8" fill="#8c4fff"/>
<text x="630" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">IGW</text>
<text x="668" y="196" font-size="12" font-weight="bold" text-anchor="start" fill="#DAF1DE">Internet Gateway</text>

<rect x="310" y="240" width="670" height="455" rx="4" fill="none" stroke="#5fbf4f" stroke-width="1.5"/>
<text x="330" y="263" font-size="14" font-weight="bold" text-anchor="start" fill="#86d96f">VPC 10.20.0.0/16</text>

<rect x="330" y="280" width="290" height="270" rx="4" fill="#0f2c35" stroke="#4fa3d1" stroke-width="1.2"/>
<text x="345" y="297" font-size="12" font-weight="bold" text-anchor="start" fill="#7cc0e6">Availability Zone ca-central-1a</text>
<rect x="345" y="305" width="260" height="105" rx="4" fill="#1a3320" stroke="#8fbf3a" stroke-width="1"/>
<text x="360" y="322" font-size="12" font-weight="normal" text-anchor="start" fill="#86d96f">Public subnet 10.20.0.0/24</text>
<rect x="367" y="335" width="56" height="56" rx="8" fill="#8c4fff"/>
<text x="395" y="368" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">NAT</text>
<text x="433" y="358" font-size="12" font-weight="bold" text-anchor="start" fill="#DAF1DE">NAT Gateway</text>
<text x="433" y="374" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B">one, shared by both AZs</text>
<rect x="345" y="430" width="260" height="105" rx="4" fill="#0d3134" stroke="#2fc4c6" stroke-width="1"/>
<text x="360" y="447" font-size="12" font-weight="normal" text-anchor="start" fill="#7cc0e6">Private subnet 10.20.10.0/24</text>
<text x="360" y="490" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">internet → NAT Gateway</text>
<text x="360" y="506" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">homelab → VGW</text>

<rect x="640" y="280" width="290" height="270" rx="4" fill="#0f2c35" stroke="#4fa3d1" stroke-width="1.2"/>
<text x="655" y="297" font-size="12" font-weight="bold" text-anchor="start" fill="#7cc0e6">Availability Zone ca-central-1b</text>
<rect x="655" y="305" width="260" height="105" rx="4" fill="#1a3320" stroke="#8fbf3a" stroke-width="1"/>
<text x="670" y="322" font-size="12" font-weight="normal" text-anchor="start" fill="#86d96f">Public subnet 10.20.1.0/24</text>
<text x="670" y="360" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">no NAT here in dev,</text>
<text x="670" y="376" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">to keep hourly cost down</text>
<rect x="655" y="430" width="260" height="105" rx="4" fill="#0d3134" stroke="#2fc4c6" stroke-width="1"/>
<text x="670" y="447" font-size="12" font-weight="normal" text-anchor="start" fill="#7cc0e6">Private subnet 10.20.11.0/24</text>
<text x="670" y="490" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">internet → NAT Gateway in 1a</text>
<text x="670" y="506" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">homelab → VGW</text>

<path d="M380,430 V393" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<path d="M785,430 V420 H410 V393" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>
<path d="M423,342 H612 V230" fill="none" stroke="#8EB69B" stroke-width="2" marker-end="url(#m-s)"/>

<rect x="330" y="565" width="600" height="112" rx="4" fill="#0B2B26" stroke="#3f7a68" stroke-width="1.2"/>
<text x="345" y="587" font-size="12" font-weight="bold" text-anchor="start" fill="#DAF1DE">Private route table (shared by both private subnets)</text>
<text x="345" y="612" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">0.0.0.0/0  →  NAT Gateway (ca-central-1a)</text>
<text x="345" y="632" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">192.168.1.0/24  →  Virtual Private Gateway (propagated from the VPN)</text>
<text x="345" y="657" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B" font-style="italic">10.20.0.0/16 was chosen so it can't overlap the Rogers network (10.0.0.0/24) or the homelab LAN.</text>
<path d="M930,621 H966 V348" fill="none" stroke="#ff4fa3" stroke-width="2" marker-end="url(#m-p)"/>

<rect x="952" y="290" width="56" height="56" rx="8" fill="#8c4fff"/>
<text x="980" y="323" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VGW</text>
<rect x="930" y="252" width="99" height="30" fill="#051F20"/>
<text x="980" y="264" font-size="11" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Virtual Private</text>
<text x="980" y="278" font-size="11" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Gateway</text>

<rect x="330" y="725" width="290" height="80" rx="4" fill="#0B2B26" stroke="#5f9a84" stroke-width="1.5"/>
<rect x="346" y="741" width="48" height="48" rx="8" fill="#e7157b"/>
<text x="370" y="770" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">CW</text>
<text x="406" y="760" font-size="13" font-weight="bold" text-anchor="start" fill="#DAF1DE">CloudWatch</text>
<text x="406" y="777" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">NAT Gateway dashboard, in Terraform</text>
<text x="406" y="792" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">alarms are next</text>
<path d="M395,695 V723" fill="none" stroke="#8EB69B" stroke-width="1.5" marker-end="url(#m-g)"/>
<text x="403" y="714" font-size="10" font-weight="normal" text-anchor="start" fill="#8EB69B">NAT metrics</text>
<rect x="660" y="725" width="290" height="80" rx="4" fill="#0B2B26" stroke="#5f9a84" stroke-width="1.5"/>
<rect x="676" y="741" width="48" height="48" rx="8" fill="#e7157b"/>
<text x="700" y="770" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">CT</text>
<text x="736" y="760" font-size="13" font-weight="bold" text-anchor="start" fill="#DAF1DE">CloudTrail</text>
<text x="736" y="777" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">account-level trail, API activity</text>
<text x="736" y="792" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">not yet in Terraform</text>

<!-- VPN tunnels: the AWS side is applied -->
<path d="M1008,308 H1118" fill="none" stroke="#ff4fa3" stroke-width="2.5" marker-end="url(#m-p)" marker-start="url(#m-p)"/>
<path d="M1008,328 H1118" fill="none" stroke="#ff4fa3" stroke-width="2.5" marker-end="url(#m-p)" marker-start="url(#m-p)"/>
<text x="1060" y="298" font-size="10" font-weight="bold" text-anchor="middle" fill="#ff8cc4">2 tunnels</text>
<text x="1060" y="346" font-size="10" font-weight="normal" text-anchor="middle" fill="#ff8cc4">IPsec</text>

<!-- Homelab -->
<rect x="1090" y="150" width="380" height="670" rx="12" fill="none" stroke="#5f9a84" stroke-width="1.5"/>
<text x="1110" y="174" font-size="12" font-weight="bold" text-anchor="start" fill="#a9cdb5">ON-PREMISES HOMELAB</text>
<text x="1110" y="192" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B">192.168.1.0/24 · behind a double NAT</text>
<text x="1110" y="208" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B" font-style="italic">Full topology: Diagram 2</text>
<rect x="1120" y="275" width="320" height="86" rx="8" fill="#163832" stroke="#3f7a68" stroke-width="1.5"/>
<text x="1280" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#DAF1DE">Rogers gateway</text>
<text x="1280" y="316" font-size="11" font-weight="normal" text-anchor="middle" fill="#DAF1DE">ISP router · first NAT · 10.0.0.0/24</text>
<text x="1280" y="334" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B" font-style="italic">its public IP is the AWS customer gateway</text>
<text x="1280" y="349" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B" font-style="italic">(dynamic, kept out of code)</text>
<path d="M1280,361 V393" fill="none" stroke="#8EB69B" stroke-width="2"/>
<rect x="1120" y="393" width="320" height="64" rx="8" fill="#132a4a" stroke="#6b9cf5" stroke-width="1.5"/>
<text x="1280" y="418" font-size="13" font-weight="bold" text-anchor="middle" fill="#bcd3ff">Cisco RV260</text>
<text x="1280" y="436" font-size="11" font-weight="normal" text-anchor="middle" fill="#bcd3ff">router · firewall · second NAT · 192.168.1.1</text>
<path d="M1280,457 V485" fill="none" stroke="#8EB69B" stroke-width="2"/>
<rect x="1120" y="485" width="320" height="56" rx="8" fill="#132a4a" stroke="#6b9cf5" stroke-width="1.5"/>
<text x="1280" y="508" font-size="13" font-weight="bold" text-anchor="middle" fill="#bcd3ff">Cisco Catalyst 3550 (SW1)</text>
<text x="1280" y="526" font-size="11" font-weight="normal" text-anchor="middle" fill="#bcd3ff">Layer 3 switch</text>
<path d="M1280,541 V569" fill="none" stroke="#8EB69B" stroke-width="2"/>
<rect x="1120" y="569" width="320" height="226" rx="8" fill="#12382a" stroke="#4ccf7a" stroke-width="1.5"/>
<text x="1280" y="591" font-size="13" font-weight="bold" text-anchor="middle" fill="#a6efc0">HP EliteDesk · Proxmox VE</text>
<text x="1280" y="608" font-size="11" font-weight="normal" text-anchor="middle" fill="#a6efc0">192.168.1.50</text>
<rect x="1140" y="622" width="280" height="76" rx="6" fill="#2e2510" stroke="#f0a53a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1280" y="644" font-size="12" font-weight="bold" text-anchor="middle" fill="#f7c97a">strongSwan VM · 192.168.1.30</text>
<text x="1280" y="662" font-size="11" font-weight="normal" text-anchor="middle" fill="#f7c97a">ends both tunnels · route-based (VTI)</text>
<text x="1280" y="680" font-size="10" font-weight="normal" text-anchor="middle" fill="#f7c97a" font-style="italic">in progress</text>
<rect x="1140" y="710" width="280" height="68" rx="6" fill="#0B2B26" stroke="#4ccf7a" stroke-width="1.2"/>
<text x="1280" y="733" font-size="12" font-weight="bold" text-anchor="middle" fill="#a6efc0">Caddy LXC · 192.168.1.20</text>
<text x="1280" y="751" font-size="11" font-weight="normal" text-anchor="middle" fill="#a6efc0">serves this portfolio</text>
<text x="1280" y="767" font-size="10" font-weight="normal" text-anchor="middle" fill="#8EB69B">deployed by GitHub Actions over Tailscale</text>
<path d="M1120,345 H1104 V660 H1138" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-p)"/>

<!-- Legend -->
<text x="30" y="862" font-size="12" font-weight="bold" text-anchor="start" fill="#DAF1DE">Legend</text>
<path d="M90,858 H130" fill="none" stroke="#8EB69B" stroke-width="2"/>
<text x="138" y="862" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">built</text>
<path d="M190,858 H230" fill="none" stroke="#ff4fa3" stroke-width="2.5"/>
<text x="238" y="862" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">IPsec VPN (AWS side applied)</text>
<path d="M430,858 H470" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-dasharray="6 4"/>
<text x="478" y="862" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">in progress (homelab end)</text>
<path d="M660,858 H700" fill="none" stroke="#8EB69B" stroke-width="1.5"/>
<text x="708" y="862" font-size="11" font-weight="normal" text-anchor="start" fill="#a9cdb5">metrics</text>
<text x="30" y="886" font-size="11" font-weight="normal" text-anchor="start" fill="#8EB69B" font-style="italic">Pairs with Diagram 2: homelab network &amp; overlay.</text>
</svg>
